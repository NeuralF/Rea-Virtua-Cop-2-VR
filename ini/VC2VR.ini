[vr]
; 0 = порядок рисования из DLL (как в движке), 1 = z-буфер
depth = 0
; сглаживание рёбер (MSAA). 1 = выкл, 2 / 4 / 8 = кратность.
msaa = 4
; масштаб глазных буферов в процентах от рекомендованного шлемом. 50..250.
supersample = 140

; на какой дистанции (в метрах) висит точка прицела/лазера, когда луч НЕ попал
; в реконструированную геометрию (враг, проём, небо). И лазер, и экранный прицел
; игры строятся из ОДНОЙ этой точки, поэтому они всегда совпадают - куда лазер,
; туда и выстрел. Меньше - прицел ближе к центру при промахе; больше - дальше.
; 6 - разумно для городского уровня. Диапазон 1..100.
aimreach = 6

; зум — теперь ПЕРЕКЛЮЧАТЕЛЬ: толчок стика вверх включает, ещё толчок выключает.
; zoom — кратность в процентах (250 = 2.5x). zoomspeed — скорость наплыва,
; процент оставшегося пути за кадр (4 при 90 Гц ≈ секунда; больше = резче).
zoom = 250
zoomspeed = 4

; автозум: следовать за зумом самой игры (она сама сужает fov 60->18 в
; постановочные моменты дальнего боя). 1 = вкл, 0 = только ручной toggle.
; кратность ограничена сверху ключом zoom.
autozoom = 1
; прятать родной синий спрайт прицела: радиус в пикселях вокруг нашей точки
; наведения, в котором маленький оверлейный квад считается прицелом и
; схлопывается. 0 = не прятать.
hidecross = 48
; поднимать окно игры на передний план при старте (игра снимается с паузы)
focusgame = 1
