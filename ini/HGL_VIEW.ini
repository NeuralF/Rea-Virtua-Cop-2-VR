[view]
; снять отсечение по пирамиде видимости в PPJ2DD.EXE (правка 6 байт в памяти,
; файл на диске не трогается). 1 = снять, 0 = оставить как в игре
nocull = 1

; снять поштучный отбор объектов декораций (правка 3 байт по 0x00440A70).
; это второе, более грубое отсечение: игра целиком выбрасывает объект, если
; он не попал в горизонтальное окно вокруг курса камеры или стоит далеко.
; именно оно резало город при повороте головы. 1 = снять, 0 = оставить.
; если станет тормозить или полезет мусор - поставить 0 и сравнить
noobjcull = 1

; брать поле зрения из игры, а не из ключа fov ниже. игра меняет угол обзора
; на лету при зуме камеры (0x004DB8A4, от 60 до ~18 градусов), и с жёстким fov
; всю сцену раздувает и рвёт. 1 = читать из игры (правильно), 0 = как раньше
liveproj = 1

; продлить город вперёд. игра рисует ровно ОДИН список объектов - тот кусок
; трассы, где стоит игрок (курсор 0x004CF81C, вызов по 0x00440D69). здесь
; задаётся, сколько СЛЕДУЮЩИХ кусков дорисовать сверх него.
; 0 = как в игре, 2 = разумно, больше - дальше видно и тяжелее.
; упирается в границу секции: назад и за чекпоинт это не смотрит
cityahead = 2

; сколько квадов за кадр отдавать в HGL_D3D. её список кадра вмещает ровно
; 3000 записей по 0xCC байт и НЕ проверяет границу: квад 3001 пишется поверх
; таблицы текстур - сперва текстуры сходят с ума, потом игра падает.
; всё, что сверх этого числа, остаётся только у нас (наш буфер на 40000),
; поэтому окно игры теряет дальнюю геометрию, а VR-вид нет.
quadcap = 2900

; выбрасывать квады с насыщенными экранными координатами. HGL_D3D зажимает
; проекцию в +-10000 (0x00445CA0), и вершина, оказавшаяся вплотную к глазу,
; приходит к нам с числом 10000, которое уже ничего не значит. в плоской игре
; это просто заливка до края экрана, у нас - полоса через весь обзор.
; это и есть глюк при выстреле. 1 = выбрасывать, 0 = как было
clampdrop = 1

; текстура квада берётся напрямую по номеру слота (base + slot) - это теперь
; подтверждено: в probe строка "miss 0..0", ни один id не остаётся неопознан.
; 1 вернёт старый подбор по цвету с экрана, который записывался НАВСЕГДА и
; из-за одной ранней ошибки сажал дорожный знак на тротуар до конца сеанса
texlearn = 0

; ЗАЛИВКА ЗЕМЛИ - это выдуманная геометрия, в игре её нет. плоская плита под
; всей сценой, чтобы пустота читалась как асфальт, а не как дыра. к бордюрам
; и рельефу она не привязана и привязана не будет.
; 1 = включить
groundfill = 1
; на сколько единиц ниже глаза лежит плита. -215 посчитано по дампу: любой
; квад дороги (слой 6), развёрнутый обратно, ложится на y = -215 +-10.
; прежнее -1030 было ошибкой в комментарии, плита уходила под горизонт
groundy = -215
; половина стороны плиты
groundsize = 60000
; -1 = ровный серый цвет; номер текстуры = натянуть её (смотрите id в probe)
groundtex = -1
; сколько раз повторить текстуру по стороне
groundtile = 8

target = HGL_D3D.DLL
; используется только когда liveproj = 0 или игра ещё не задала проекцию
fov = 60
units_per_metre = 644
share = 1
window = 1
width  = 1280
height = 720

; слой 3: 0 = рисовать (правильно, порядок наложения решает сортировка),
; 1 = аварийно выбросить
skip3 = 0

inject = 2
screen = 1
capture = 2
shade = 2
textures = 1
alphakey = 1
; -1 = как в движке (flags>>4)&3, 0..2 = принудительно, клавиша [T]
uvorder = -1

; яркость поверх точной формулы движка, 100 = формула как есть
texgain = 100

texdump = 0
zflip = 0

; 0 = как в движке: z-буфера нет, порядок задаёт сортировка (правильно)
; 1 = включить z-буфер (эксперимент)
depth = 0

; 2D-накладка (HUD): 1 = рисовать, 0 = выключить
sprites = 1
sprdist = 1500
; на каком расстоянии стоит небо (приоритет 3)
sprfar = 90000


; ---- небо ----
; 1 = натягивать панораму на цилиндр вокруг игрока (иначе плоский прямоугольник)
skydome = 1
; закрыть купол над головой. панорама в игре кончается примерно в 21 градусе
; над горизонтом, выше в ней НИЧЕГО не нарисовано, так что верх приходится
; досочинять. 1 = ровная шапка цветом верхнего края панорамы (по умолчанию),
; 0 = не закрывать, над головой будет чернота
skycap = 1

; ---- накладка против событий мира ----
; спрайты приходят как экранные прямоугольники, и их надо разворачивать в 3D.
; интерфейс (прицел, барабан, сердца, CREDITS) должен держать один размер, а
; всплеск попадания - стоять там, куда попала пуля, то есть через ТЕКУЩУЮ
; проекцию игры. отличаются по банку текстур: интерфейс грузится один раз с
; базой 0 (id 0..1547), эффекты живут в банках этапа (1600, 1900).
; 1 = так и делать (по умолчанию)
; 0 = все спрайты по живой проекции (интерфейс будет менять размер при зуме)
; 2 = все приоритеты 1-2 фиксированы (старое поведение, всплески уезжают)
hudfix = 1


; ==== ПРИЦЕЛИВАНИЕ И СТВОЛ (VR) ====
; игра читает ствол ТОЛЬКО как WinMM-джойстик (joyGetPosEx). DLL перехватывает
; его и подаёт наведение из VR. Старый ключ inject выше больше не используется.

; мастер-выключатель всего перехвата ствола. 0 = не трогать ввод игры.
joygun = 1

; форсить у игрока 0 аналоговый ствол (тип устройства 3). без этого меню могло
; выставить цифровой тип и прицел не двигался вовсе. 0 = не форсить.
joyforce = 1

; вырезать опрос ВТОРОГО игрока (5 байт NOP по 0x00426A90). 1 = один игрок.
oneplayer = 1

; РЕЖИМ прицела:
;   1 = обратная связь: DLL читает реальный прицел игры (спрайт) и сводит его
;       в точку лазера. цель - абсолютное наведение "куда лазер, туда прицел".
;   0 = запаска: прямой абсолют. прицел ДВИГАЕТСЯ, но лениво (игра трактует ось
;       как скорость). поставь 0, если в режиме 1 прицел стоит на месте.
joymode = 1

; коэффициент петли обратной связи, В ПРОЦЕНТАХ (200 = 2.00).
; лагает/медленно догоняет - подними (250, 300). дёргается/осциллирует - опусти
; (150, 100, 50). работает только при joymode = 1.
joygain = 200

; ДИАГНОСТИКА. 1 = писать VC2VR_JOY.LOG рядом с игрой (~10 строк/сек):
; что видит петля - позицию спрайта-прицела, цель из VR, что подаётся в игру.
; включи, поиграй 5-10 секунд, пришли файл - по нему видно, где рвётся.
joylog = 0

; перевернуть ось Y, если прицел ходит вверх ногами. 0 = как есть.
joyinverty = 0

; биты кнопок джойстика для триггера/старта/бэка. обычно не трогать.
joyfirebit = 0
joystartbit = 1
joybackbit = 2
