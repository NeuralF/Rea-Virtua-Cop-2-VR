; HGL_VIEW.ini - game side of VC2VR. Put next to HGL_VIEW.DLL.
; Every value below differs from the built-in default or is worth knowing.

[view]

; Game units per metre - world scale. 134 = eye height 1.6 m.
units_per_metre = 134

; Renderer the mod forwards to. Do not change.
target = HGL_D3D.DLL

; 360-degree world: extra camera passes and object memory. Keep on.
passes = 1
passdedup = 0
omfar = 0
omlocal = 0
wedgefix = 0
neardropx = 0
skycull = 0

; Brightness on top of the engine's formula, percent.
texgain = 100

; Faked distant backdrops pushed out along their rays, percent.
farscale = 1000

; Second controller as player 2 (needs akimbo = 1 in VC2VR.ini too).
akimbo = 1

; The game's flat crosshair sprites. 1 = hide them (the laser replaces them),
; 3 = keep player 2's - for a second person aiming on the monitor window.
hidexhair = 1

; Flat window with the reconstructed world on the monitor. 0 = none.
window = 1

; HUD sprites dropped by texture id; the car dashboard, placed by hand.
hudhide = 1546,1603-1607,1623,1838,1839
panelids = 1546,1603-1607,1623
paneldrop = 200
